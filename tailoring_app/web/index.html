<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CouturePro Demo">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CouturePro Demo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>CouturePro Demo</title>
  <script>
    window.changeFavicon = function(src) {
      if (!src) src = 'favicon.png';
      var buster = src + (src.indexOf('?') > -1 ? '&v=' : '?v=') + new Date().getTime();
      
      var iconTypes = ["link[rel='icon']", "link[rel='shortcut icon']", "link[rel='apple-touch-icon']"];
      iconTypes.forEach(function(selector) {
        var el = document.querySelector(selector);
        if (!el) {
          el = document.createElement('link');
          if (selector.indexOf('apple') > -1) {
            el.rel = 'apple-touch-icon';
          } else {
            el.rel = 'icon';
            el.type = 'image/png';
          }
          document.getElementsByTagName('head')[0].appendChild(el);
        }
        el.href = buster;
      });
    };
    window.changeTitle = function(title) {
      if (!title) return;
      document.title = title;
      var metaTitle = document.querySelector("meta[name='apple-mobile-web-app-title']");
      if (metaTitle) {
        metaTitle.setAttribute('content', title);
      }
    };
    (function() {
      fetch('/api/settings/public')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.shop_name) {
            window.changeTitle(data.shop_name);
          }
          if (data && data.logo_url) {
            window.changeFavicon(data.logo_url);
          } else {
            window.changeFavicon('favicon.png');
          }
        })
        .catch(function(err) {
          window.changeFavicon('favicon.png');
        });
    })();
  </script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
