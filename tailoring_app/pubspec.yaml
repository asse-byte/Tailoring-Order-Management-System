name: tailoring_app
description: Tailoring Order Management System - manage tailoring orders, customers, measurements, and reports.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8



  # State + Navigation
  provider: ^6.1.2
  go_router: ^14.2.7

  # Offline / Local
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0

  # REST API
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2

  # Utilities
  image_picker: ^1.1.2
  intl: ^0.20.2
  uuid: ^4.5.1
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.0.2
  video_player: ^2.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # No shop logo is bundled on purpose: one build serves every shop, so a
  # bundled logo would ship one customer's branding to all the others. The
  # logo is fetched per shop from the settings `logo_url`, with the neutral
  # initial placeholder when a shop has not uploaded one.
  #
  # These fonts ARE bundled, and must stay bundled. Every PDF the app produces
  # (facture, reçu, rapport) used the pdf package's built-in Helvetica, which
  # has no Unicode support: "—", "’" and "œ" could not be drawn at all, so
  # "Main d'œuvre" and every "Revenus — ..." line came out with holes in them.
  # They are loaded from these assets, never fetched from Google at runtime —
  # the shops work offline and an invoice must never depend on the network.
  # Poppins is the app's UI face. It used to be pulled from Google at runtime by
  # the google_fonts package on first launch: a shop in Mali with no connection
  # silently got the system font instead, so the app looked different from the
  # one that was designed. Bundling it (and turning runtime fetching off in
  # main.dart) makes every launch identical and offline-safe. google_fonts
  # matches these by filename, so the names must stay exactly as they are.
  assets:
    - assets/fonts/
    - assets/google_fonts/
  fonts:
    # The interface icon family: Phosphor Regular, one weight for the whole app
    # (the screens used to mix three eras of Material glyphs). The font is
    # vendored rather than pulled from `phosphor_flutter`, whose IconData
    # subclass no longer compiles now that Flutter made IconData final; see
    # lib/core/theme/couture_icons.dart. MIT licence in assets/icons/.
    - family: PhosphorRegular
      fonts:
        - asset: assets/icons/Phosphor.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
